# Render Blueprint: the website (landing page and app), on the free plan, no card needed.
#
# The memory is still a real FalkorDB graph: with FALKORDB_HOST unset, the app starts FalkorDB embedded
# in the same container (the falkordblite package). Free web services have no persistent disk, so
# memories are kept only while the service is running; when it sleeps or redeploys they reset.
# That suits a public demo, where every visitor starts with a blank private memory anyway.
# For memories that survive restarts, run the website with its own FalkorDB: see docker-compose.yml.
#
# Deploy: push this repo to GitHub, then on Render choose New > Blueprint and select the repo.
services:
  - type: web
    name: decisive
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python ui_server.py --host 0.0.0.0   # the app listens on $PORT, which Render sets
    plan: free              # sleeps after ~15 minutes without visits and takes about a minute to wake
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODE
        value: "off"
      - key: UI_MAX_SESSIONS   # most people's memories this server will hold; beyond it, new visitors get a 503
        value: "500"
