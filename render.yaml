# Render Blueprint: the website (landing page and app) plus its FalkorDB database.
#
# Deploy: push this repo to GitHub, then on Render choose New > Blueprint and select the repo.
# Both services are created in one region so they can reach each other on Render's private network.
services:
  # The database. A private service: reachable only by your other services, never from the internet.
  # Disks and private services need a paid plan on Render (there is no free tier for either).
  - type: pserv
    name: falkordb
    runtime: image
    image:
      url: docker.io/falkordb/falkordb:v4.22.1-alpine   # the version every reported result was produced on
    plan: starter
    region: oregon
    disk:
      name: falkordb-data
      mountPath: /var/lib/falkordb/data                 # memories survive restarts and deploys
      sizeGB: 1

  # The website. Builds from the Dockerfile in this repo.
  - type: web
    name: decisive
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "python ui_server.py --host 0.0.0.0 --port ${PORT:-10000}"
    plan: free              # sleeps after ~15 minutes without visits and takes about a minute to wake
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: FALKORDB_HOST
        fromService:
          type: pserv
          name: falkordb
          property: host
      - key: FALKORDB_PORT
        value: "6379"
      - key: LLM_MODE
        value: "off"
      - key: UI_MAX_SESSIONS   # most people's memories this server will hold; beyond it, new visitors get a 503
        value: "2000"
